# ============================================================
#  categories テーブル → Elasticsearch の categories インデックス
#  （enrich プロセッサの参照元になる）
# ============================================================
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["shop.shopdb.categories"]
    group_id          => "logstash-categories-sink"
    auto_offset_reset => "earliest"
    codec             => json
    ecs_compatibility => disabled
  }
}

filter {
  if [__deleted] == "true" {
    mutate { add_field => { "[@metadata][action]" => "delete" } }
  } else {
    mutate { add_field => { "[@metadata][action]" => "index" } }
  }
  mutate { add_field => { "[@metadata][version]" => "%{[__source_ts_ms]}" } }
  mutate {
    remove_field => ["@version", "event", "__deleted", "__op",
                     "__source_ts_ms", "__source_file", "__source_pos"]
  }
}

output {
  elasticsearch {
    hosts           => ["http://elasticsearch:9200"]
    index           => "categories"
    document_id     => "%{[code]}"
    action          => "%{[@metadata][action]}"
    version         => "%{[@metadata][version]}"
    version_type    => "external_gte"
    manage_template => false
  }
}
