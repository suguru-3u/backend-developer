# ============================================================
#  Kafka（Debeziumの変更イベント） → Elasticsearch
#
#  前提：Debeziumソースコネクタ側で ExtractNewRecordState を有効にし、
#        delete.tombstone.handling.mode=rewrite にしてあること。
#        （削除は __deleted="true" の付いた通常メッセージとして届く）
# ============================================================

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["shop.shopdb.products"]
    group_id          => "logstash-es-sink"
    client_id         => "logstash-es-sink"
    auto_offset_reset => "earliest"
    codec             => json
    ecs_compatibility => disabled
  }
}

filter {

  # ---------- 1. 削除か、追加/更新かを振り分ける ----------
  if [__deleted] == "true" {
    mutate { add_field => { "[@metadata][action]" => "delete" } }
  } else {
    mutate { add_field => { "[@metadata][action]" => "index" } }
  }

  # ---------- 2. MySQLの型 → Elasticsearchの型 ----------
  # BOOLEAN の実体は TINYINT(1) なので 1 / 0 で届く
  mutate { convert => { "in_stock" => "boolean" } }

  # tags はカンマ区切りの文字列。ESでは keyword の配列にしたい
  if [tags] and [tags] != "" {
    mutate { split => { "tags" => "," } }
  }

  # ---------- 3. 不要なフィールドを落とす ----------
  # __op / __source_* は Debezium のメタデータ（第17章で使うので残す選択もある）
  mutate {
    remove_field => [
      "@version", "event",
      "__deleted", "__op", "__source_ts_ms", "__source_file", "__source_pos"
    ]
  }
}

output {
  elasticsearch {
    hosts           => ["http://elasticsearch:9200"]
    index           => "products"

    # 冪等性の要：ドキュメントIDに MySQL の主キーをそのまま使う
    document_id     => "%{[id]}"
    action          => "%{[@metadata][action]}"

    # 自分で作ったマッピングをLogstashに上書きさせない（重要）
    manage_template => false
  }

  # 学習用：処理結果を標準出力にも出す。慣れたらコメントアウトしてよい
  # stdout { codec => rubydebug { metadata => true } }
}
